components:
  schemas:
    Unauthorized:
      type: object
      properties:
        message:
          description: The error message describing the reason for the exception
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        statusCode:
          type: number
          description: The HTTP status code of the response
          examples:
          - 401
        error:
          type: string
          description: The type of error
          examples:
          - Unauthorized
      required:
      - message
      - statusCode
      - error
    ServiceUnavailable:
      type: object
      properties:
        message:
          description: The error message describing the reason for the exception
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        statusCode:
          type: number
          description: The HTTP status code of the response
          examples:
          - 503
        error:
          type: string
          description: The type of error
          examples:
          - Service Unavailable
      required:
      - message
      - statusCode
      - error
    BadGateway:
      type: object
      properties:
        message:
          description: The error message describing the reason for the exception
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        statusCode:
          type: number
          description: The HTTP status code of the response
          examples:
          - 502
        error:
          type: string
          description: The type of error
          examples:
          - Bad Gateway
      required:
      - message
      - statusCode
      - error
    ValidatorInformation:
      type: object
      properties:
        timestamp:
          type: number
        subnetID:
          type: string
        nodeID:
          type: string
        addresses:
          type: array
          items:
            type: string
        delegationFee:
          type: number
        delegatorCount:
          type: number
        delegatorWeight:
          type: number
        endTime:
          type: number
        startTime:
          type: number
        status:
          type: string
        transactionHash:
          type: string
        weight:
          type: number
      required:
      - timestamp
      - subnetID
      - nodeID
      - addresses
      - delegationFee
      - delegatorCount
      - delegatorWeight
      - endTime
      - startTime
      - status
      - transactionHash
      - weight
    StakingInformationResponse:
      type: object
      properties:
        nextPageStartKey:
          type: string
        lastRun:
          type: number
          examples:
          - 1717757617
        status:
          type: number
          examples:
          - 200
        results:
          type: array
          items:
            $ref: '#/components/schemas/StakingInformation'
      required:
      - status
      - results

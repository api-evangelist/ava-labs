      - 2q9e4r6Mu3U68nU1fYjgbR6JvwrRx36CohpAX5UQxse55x1Q5
      - yH8D7ThNJkxmtkuv2jgBa4P1Rn3Qpr4pPr7QYNfcdoS6k6HWp
      - p-chain
      - x-chain
      - c-chain
    UtxoType:
      type: string
      description: Indicates whether the UTXO is staked or transferable
      enum:
      - STAKE
      - TRANSFER
    RewardType:
      type: string
      enum:
      - VALIDATOR
      - DELEGATOR
      - VALIDATOR_FEE
    PrimaryNetworkChainInfo:
      type: object
      properties:
        chainName:
          $ref: '#/components/schemas/PrimaryNetworkChainName'
        network:
          $ref: '#/components/schemas/Network'
      required:
      - chainName
      - network
    ListPChainTransactionsResponse:
      type: object
      properties:
        nextPageToken:
          type: string
          description: A token, which can be sent as `pageToken` to retrieve the next page. If this field is omitted or empty, there are no subsequent pages.
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/PChainTransaction'
        chainInfo:
          $ref: '#/components/schemas/PrimaryNetworkChainInfo'
      required:
      - transactions
      - chainInfo
    XChainNonLinearTransaction:
      type: object
      properties:
        txHash:
          type: string
          description: Unique ID for this transaction.
          examples:
          - 3j9JpF1aGuQtLLbo3YkvvKkWrCZViXZjdeJQWUSEY5hcqUn2c
        chainFormat:
          type: string
          description: Represents chain format this transaction is included in.
          enum:
          - non-linear
          - linear
          examples:
          - non-linear
        timestamp:
          type: number
          description: Latest timestamp in seconds this transaction was accepted out of the same transaction accepted in other vertices.
          examples:
          - 1600762738
        txType:
          examples:
          - BaseTx
          $ref: '#/components/schemas/XChainTransactionType'
        memo:
          type: string
          description: Hex encoded memo bytes for this transaction.
          examples:
          - '0x546865204176616c616e6368652050726f6a656374'
        consumedUtxos:
          type: array
          items:
            $ref: '#/components/schemas/Utxo'
        emittedUtxos:
          type: array
          items:
            $ref: '#/components/schemas/Utxo'
        amountUnlocked:
          description: Assets unlocked by inputs of this transaction.
          type: array
          items:
            $ref: '#/components/schemas/AssetAmount'
        amountCreated:
          description: Assets created by outputs of this transaction.
          type: array
          items:
            $ref: '#/components/schemas/AssetAmount'
        sourceChain:
          type: string
          description: Source chain for an atomic transaction.
          examples:
          - 2oYMBNV4eNHyqk2fjjV5nVQLDbtmNJzq5s3qs3Lo6ftnC6FByM
        destinationChain:
          type: string
          description: Destination chain for an atomic transaction.
          examples:
          - 2oYMBNV4eNHyqk2fjjV5nVQLDbtmNJzq5s3qs3Lo6ftnC6FByM
        assetCreated:
          description: AssetAmount details of the asset created in CreateAssetTx
          allOf:
          - $ref: '#/components/schemas/XChainAssetDetails'
        vertices:
          description: A transaction on X-Chain can be accepted over multiple vertices.
          type: array
          items:
            $ref: '#/components/schemas/TransactionVertexDetail'
      required:
      - txHash
      - chainFormat
      - timestamp
      - txType
      - memo
      - consumedUtxos
      - emittedUtxos
      - amountUnlocked
      - amountCreated
      - vertices
    PChainUtxo:
      type: object
      properties:
        addresses:
          description: Addresses that are eligible to sign the consumption of this output.
          examples:
          - - avax1qm2a25eytsrj235hxg6jc0mwk99tss64eqevsw
          type: array
          items:
            type: string
        asset:
          $ref: '#/components/schemas/AssetAmount'
        consumedOnChainId:
          type: string
          description: Blockchain ID on which this output is consumed on.
          examples:
          - 2oYMBNV4eNHyqk2fjjV5nVQLDbtmNJzq5s3qs3Lo6ftnC6FByM
        consumingTxHash:
          type: string
          description: Transaction ID that consumed this output.
          examples:
          - 3j9JpF1aGuQtLLbo3YkvvKkWrCZViXZjdeJQWUSEY5hcqUn2c
        createdOnChainId:
          type: string
          description: Blockchain ID on which this output is created on.
          examples:
          - 2oYMBNV4eNHyqk2fjjV5nVQLDbtmNJzq5s3qs3Lo6ftnC6FByM
        utxoId:
          type: string
          description: UTXO ID for this output.
          examples:
          - 68vLva9kfKUsX88ZPM8jdbf8qHUZRoZSFH6NdpAVTspkfrXDC
        utxoBytes:
          type: string
          description: The bytes of the UTXO
        amount:
          type: string
          deprecated: true
        assetId:
          type: string
          deprecated: true
        blockNumber:
          type: string
        blockTimestamp:
          type: number
        consumingBlockNumber:
          type: string
          description: Block height in which the transaction consuming this UTXO was included
        consumingBlockTimestamp:
          type: number
          description: Timestamp in seconds at which this UTXO is used in a consuming transaction
        platformLocktime:
          type: number
          description: Timestamp in seconds after which this UTXO can be consumed
        outputIndex:
          type: number
          description: The index of the UTXO in the transaction
        rewardType:
          $ref: '#/components/schemas/RewardType'
        stakeableLocktime:
          type: number
          description: Timestamp in seconds before which a UTXO can only be used for staking transactions. After stakeable locktime, a UTXO can be used for anything
        staked:
          type: boolean
        threshold:
          type: number
          description: The minimum number of signatures required to spend this UTXO
        txHash:
          type: string
          description: The hash of the transaction that created this UTXO
        utxoEndTimestamp:
          type: number
          description: Timestamp in seconds after which the staked UTXO will be unlocked.
        utxoStartTimestamp:
          type: number
          description: Timestamp in seconds at which the staked UTXO was locked.
        utxoType:
          $ref: '#/components/schemas/UtxoType'
      required:
      - addresses
      - asset
      - consumedOnChainId
      - createdOnChainId
      - utxoId
      - amount
      - assetId
      - blockNumber
      - blockTimestamp
      - outputIndex
      - txHash
      - utxoType
    InternalServerError:
      type: object
      properties:
        message:
          description: The error message describing the reason for the exception
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        statusCode:
          type: number
          description: The HTTP status code of the response
          examples:
          - 500
        error:
          type: string
          description: The type of error
          examples:
          - Internal Server Error
      required:
      - message
      - statusCode
      - error
    PChainTransactionType:
      type: string
      enum:
      - AddValidatorTx
      - AddSubnetValidatorTx
      - AddDelegatorTx
      - CreateChainTx
      - CreateSubnetTx
      - ImportTx
      - ExportTx
      - AdvanceTimeTx
      - RewardValidatorTx
      - RemoveSubnetValidatorTx
      - TransformSubnetTx
      - AddPermissionlessValidatorTx
      - AddPermissionlessDelegatorTx
      - BaseTx
      - TransferSubnetOwnershipTx
      - ConvertSubnetToL1Tx
      - RegisterL1ValidatorTx
      - SetL1ValidatorWeightTx
      - DisableL1ValidatorTx
      - IncreaseL1ValidatorBalanceTx
      - UNKNOWN
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-glacier-api-key
      description: Api keys provide higher access to rate limits. To obtain an api key, sign up for an account at https://avacloud.io/.
x-speakeasy-retries:
  strategy: backoff
  backoff:
    initialInterval: 500
    maxInterval: 60000
    maxElapsedTime: 120000
    exponent: 1.5
  statusCodes:
  - 5XX
  retryConnectionErrors: true

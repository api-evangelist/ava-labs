          type: array
          items:
            type: string
        keyType:
          $ref: '#/components/schemas/PlatformAddressActivityKeyType'
        keys:
          description: Array of keys like addresses corresponding to the keyType being monitored. For PrimaryNetworkAddressActivity event, an array of multiple addresses can be provided. The maximum number of 'addresses' you can track depends on the Data API plan you are subscribed to.
          type: array
          items:
            type: string
        subEvents:
          description: Sub-events to monitor
          allOf:
          - $ref: '#/components/schemas/PrimaryNetworkAddressActivitySubEvents'
        balanceThresholdFilter:
          description: Balance threshold filter
          allOf:
          - $ref: '#/components/schemas/PrimaryNetworkBalanceThresholdFilter'
      required:
      - keyType
      - keys
      - subEvents

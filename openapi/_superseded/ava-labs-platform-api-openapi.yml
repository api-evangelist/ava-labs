                  type: object
                  example: {}
                  default: {}
                id:
                  type: integer
                  example: 1
                  default: 1
              required:
              - jsonrpc
              - method
              - params
              - id
            examples:
              default:
                summary: Example request
                value:
                  jsonrpc: '2.0'
                  method: platform.getHeight

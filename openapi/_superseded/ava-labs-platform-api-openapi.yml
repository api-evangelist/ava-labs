components:
  schemas:
    ValidatedByResponse:
      type: object
      properties:
        subnetID:
          type: string
          description: Avalanche ID in cb58 format
          example: 2oYMBNV4eNHyqk2fjjV5nVQLDbtmNJzq5s3qs3Lo6ftnC6FByM
      required:
      - subnetID
    ValidatesArgs:
      type: object
      properties:
        subnetID:
          type: string
          description: Avalanche ID in cb58 format
          example: 2oYMBNV4eNHyqk2fjjV5nVQLDbtmNJzq5s3qs3Lo6ftnC6FByM
      required:
      - subnetID
    GetBalanceRequest:
      type: object
      properties:
        addresses:
          type: array
          items:
            type: string
      required:
      - addresses
    GetFeeStateReply:
      type: object
      properties:
        price:
          type: object
          description: 'External type: gas.Price'
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp
      required:
      - price
      - timestamp
    GetMinStakeReply:
      type: object
      properties:
        minValidatorStake:
          type: string
          description: Unsigned 64-bit integer as string
          example: '1000000000'
        minDelegatorStake:
          type: string
          description: Unsigned 64-bit integer as string
          example: '1000000000'
      required:
      - minValidatorStake
      - minDelegatorStake
    GetSubnetArgs:
      type: object
      properties:
        subnetID:
          type: string
          description: Avalanche ID in cb58 format
          example: 2oYMBNV4eNHyqk2fjjV5nVQLDbtmNJzq5s3qs3Lo6ftnC6FByM

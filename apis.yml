aid: ava-labs
name: Ava Labs
description: >-
  Ava Labs is the company behind Avalanche, a high-throughput, low-latency smart-contract
  blockchain platform. Through AvaCloud it ships a public developer surface for building on
  Avalanche and its L1s (subnets): a Data API (glacier-api.avax.network) for balances, tokens,
  transactions, blocks, NFTs and Interchain Messaging; a Metrics API for chain performance and
  staking analytics; a Webhooks API for real-time address-activity events; and standard
  JSON-RPC access to the Primary Network's P-Chain, X-Chain and C-Chain. First-party SDKs
  (AvaCloud SDK for TypeScript, AvalancheJS, AvalancheGo in Go) and the Avalanche-CLI round out
  the toolchain. This profile was enriched from Ava Labs' published OpenAPI specs and docs.
